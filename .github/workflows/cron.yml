name: Forkathon Live Progress

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Analyze teams
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python analyzer.py

      - name: Save timestamped image snapshot
        id: snapshot
        shell: bash
        run: |
          timestamp=$(date -u +"%Y-%m-%d_%H-%M-%S")
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          mkdir -p progress
          cp output/forkathon_progress.png "progress/${timestamp}.png"

      - name: Update README
        env:
          TIMESTAMP: ${{ steps.snapshot.outputs.timestamp }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          timestamp = os.environ["TIMESTAMP"]
          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")
          marker_start = "<!-- FORKATHON_PROGRESS_START -->"
          marker_end = "<!-- FORKATHON_PROGRESS_END -->"
          new_entry = (
              f"\n### {timestamp.replace('_', ' UTC ')}\n\n"
              f"![Forkathon Progress](progress/{timestamp}.png)\n\n"
          )

          if marker_start in content and marker_end in content:
              before, remainder = content.split(marker_start, 1)
              middle, after = remainder.split(marker_end, 1)
              content = before + marker_start + new_entry + middle + marker_end + after
          else:
              content += f"\n{marker_start}\n{new_entry}{marker_end}\n"

          readme.write_text(content, encoding="utf-8")
          PY

      - name: Commit progress snapshot
        run: |
          git config user.name "ForkedArch Progress Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/forkathon_progress.png progress/ README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update Forkathon progress"
          git push
